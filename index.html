<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crime Is Legal - Financial Crime News Aggregator</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='5' y='5' width='90' height='90' fill='%23ff5500' stroke='%23000000' stroke-width='12'/><text x='50%' y='72%' font-family='Arial, sans-serif' font-weight='900' font-size='70' fill='%23000000' text-anchor='middle'>C</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #f4f4f0;
      --header-bg: #f4f4f0;
      --card-bg: #ffffff;
      --text-main: #000000;
      --accent-orange: #ff5500;
      --accent-yellow: #ffe600;
      --border-color: #000000;
      --grid-line: #eaeaea;
      --shadow-hard: 4px 4px 0px #000000;
      --shadow-hard-lg: 6px 6px 0px #000000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background-color: var(--bg-color);
      background-image: 
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--text-main);
      padding-bottom: 3rem;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    header {
      background-color: var(--header-bg);
      border-bottom: 3px solid var(--border-color);
      padding: 1.25rem 2rem;
      margin-bottom: 2.5rem;
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.25rem;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      flex-wrap: wrap;
    }

    .brand-logo-box {
      background-color: #ffffff;
      border: 3px solid var(--border-color);
      box-shadow: var(--shadow-hard-lg);
      padding: 0.6rem 1rem;
      text-decoration: none;
      color: var(--text-main);
      display: inline-flex;
      align-items: baseline;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .brand-logo-box:hover {
      transform: translate(-2px, -2px);
      box-shadow: 8px 8px 0px #000000;
    }

    .brand-logo-text {
      display: inline-block;
    }

    .brand-domain {
      font-size: 0.85rem;
      font-weight: 800;
      margin-left: 2px;
      position: relative;
      top: -2px;
    }

    .header-tagline-container {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .header-divider {
      width: 2px;
      height: 28px;
      background-color: var(--border-color);
    }

    .header-tagline {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-main);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    nav {
      display: flex;
      gap: 0.75rem;
    }

    .nav-btn {
      background-color: #ffffff;
      color: #000000;
      border: 3px solid var(--border-color);
      box-shadow: 3px 3px 0px #000;
      padding: 0.6rem 1.1rem;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      text-decoration: none;
      transition: all 0.1s ease;
    }

    .nav-btn:hover, .nav-btn.active {
      background-color: var(--accent-orange);
      color: #ffffff;
    }

    .grid-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .news-card {
      background-color: var(--card-bg);
      border: 3px solid var(--border-color);
      box-shadow: var(--shadow-hard-lg);
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .news-card:hover {
      transform: translate(-2px, -2px);
      box-shadow: 8px 8px 0px #000000;
    }

    .card-image-wrapper {
      position: relative;
      width: 100%;
      height: 160px;
      border-bottom: 3px solid var(--border-color);
      overflow: hidden;
      background-color: #e5e7eb;
    }

    .card-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-body {
      padding: 1.1rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .source-tag {
      background-color: var(--accent-yellow);
      color: #000000;
      border: 2px solid var(--border-color);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      padding: 0.2rem 0.45rem;
      text-transform: uppercase;
      box-shadow: 2px 2px 0px #000;
    }

    .card-date {
      color: #000000;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .card-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 0.5rem;
      flex-grow: 1;
    }

    .card-title a {
      color: var(--text-main);
      text-decoration: none;
      transition: background-color 0.1s ease;
    }

    .card-title a:hover {
      background-color: var(--accent-yellow);
      padding: 0 0.2rem;
    }

    .skeleton-card {
      pointer-events: none;
    }

    .skeleton-box {
      background-color: #e5e7eb;
      position: relative;
      overflow: hidden;
    }

    .skeleton-box::after {
      content: "";
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      transform: translateX(-100%);
      background-image: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0,
        rgba(255, 255, 255, 0.4) 20%,
        rgba(255, 255, 255, 0.6) 60%,
        rgba(255, 255, 255, 0)
      );
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      100% {
        transform: translateX(100%);
      }
    }

    .skeleton-title {
      height: 1.2rem;
      margin-bottom: 0.5rem;
      border: 2px solid var(--border-color);
    }

    .pagination-container {
      max-width: 1200px;
      margin: 3.5rem auto 1rem auto;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
    }

    .pagination-btn {
      background-color: var(--accent-orange);
      color: #ffffff;
      border: 3px solid var(--border-color);
      box-shadow: var(--shadow-hard);
      padding: 0.6rem 1.5rem;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.1s ease;
    }

    .pagination-btn:hover:not(:disabled) {
      background-color: #e04b00;
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #000000;
    }

    .pagination-btn:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000000;
    }

    .pagination-btn:disabled {
      opacity: 0.4;
      background-color: #ffffff;
      color: #000000;
      cursor: not-allowed;
      box-shadow: none;
    }

    .page-indicator {
      background-color: #ffffff;
      border: 2px solid var(--border-color);
      padding: 0.5rem 1rem;
      font-weight: 700;
      font-size: 0.85rem;
      box-shadow: 2px 2px 0px #000;
    }

    .status-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 1rem;
      background-color: #ffffff;
      border: 3px solid var(--border-color);
      box-shadow: var(--shadow-hard);
      font-weight: 700;
      font-size: 1.1rem;
    }

    /* ADMIN CONTROLS & MODAL STYLING */
    .admin-delete-btn,
    .admin-add-btn {
      display: none;
    }

    body.is-admin .admin-delete-btn {
      display: inline-block;
      background: #ff5555;
      color: #000;
      border: 2px solid var(--border-color);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      padding: 0.15rem 0.4rem;
      cursor: pointer;
      box-shadow: 2px 2px 0px #000;
    }

    body.is-admin .admin-add-btn {
      display: inline-block;
      background-color: var(--accent-yellow);
      color: #000000;
      border: 3px solid var(--border-color);
      box-shadow: 3px 3px 0px #000;
      padding: 0.6rem 1.1rem;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      cursor: pointer;
    }

    /* NEO-BRUTALIST MODAL OVERLAY */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: #ffffff;
      border: 4px solid var(--border-color);
      box-shadow: var(--shadow-hard-lg);
      width: 100%;
      max-width: 500px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid var(--border-color);
      padding-bottom: 0.5rem;
    }

    .modal-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .modal-close {
      background: #ff5555;
      border: 2px solid #000;
      font-weight: bold;
      padding: 0.2rem 0.5rem;
      cursor: pointer;
      box-shadow: 2px 2px 0px #000;
    }

    .modal-form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .modal-form label {
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
    }

    .modal-form input {
      width: 100%;
      padding: 0.6rem;
      border: 2px solid var(--border-color);
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 0.9rem;
      outline: none;
    }

    .modal-form input:focus {
      background-color: #fffde6;
    }

    .modal-submit-btn {
      background-color: var(--accent-orange);
      color: #ffffff;
      border: 3px solid var(--border-color);
      box-shadow: var(--shadow-hard);
      padding: 0.75rem;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 0.5rem;
    }

    .modal-submit-btn:hover {
      background-color: #e04b00;
    }

    @media (max-width: 640px) {
      header {
        padding: 1rem;
      }
      .brand-line, .brand-bottom-line {
        font-size: 1.15rem;
      }
      .brand-bracket {
        font-size: 1.25rem;
      }
      .brand-domain {
        font-size: 0.75rem;
      }
      .header-right {
        width: 100%;
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>

<header>
  <div class="header-container">
    <div class="header-left">
      <a href="index.html" class="brand-logo-box">
        <span class="brand-logo-text">[CRIME IS LEGAL]</span><span class="brand-domain">.EU</span>
      </a>
      <div class="header-tagline-container">
        <div class="header-divider"></div>
        <span class="header-tagline">FINANCIAL CRIME NEWS AGGREGATOR</span>
      </div>
    </div>
    
    <div class="header-right">
      <button class="admin-add-btn" onclick="openAddModal()">+ Add Card</button>
      <nav>
        <a href="index.html" class="nav-btn active">Live Feed</a>
        <a href="about.html" class="nav-btn">About the project</a>
      </nav>
    </div>
  </div>
</header>

  <main>
    <div id="news-container" class="grid-container">
      <script>
        document.write(Array(12).fill(`
          <article class="news-card skeleton-card">
            <div class="card-image-wrapper skeleton-box"></div>
            <div class="card-body">
              <div class="card-meta">
                <div class="skeleton-box" style="width: 70px; height: 18px; border: 2px solid #000;"></div>
                <div class="skeleton-box" style="width: 50px; height: 14px;"></div>
              </div>
              <div class="skeleton-box skeleton-title" style="width: 90%;"></div>
              <div class="skeleton-box skeleton-title" style="width: 60%;"></div>
            </div>
          </article>
        `).join(''));
      </script>
    </div>

    <div class="pagination-container">
      <button id="prev-btn" class="pagination-btn" onclick="changePage(-1)" disabled>&larr; Previous</button>
      <span id="page-indicator" class="page-indicator">Page 1</span>
      <button id="next-btn" class="pagination-btn" onclick="changePage(1)" disabled>&rarr; Next</button>
    </div>
  </main>

  <!-- ADMIN AUTH MODAL OVERLAY -->
  <div id="auth-card-modal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title">Admin Authentication</span>
        <button class="modal-close" onclick="closeAuthModal()">X</button>
      </div>
      <form class="modal-form" onsubmit="submitAdminAuth(event)">
        <div>
          <label for="admin-secret-key">Secret Key *</label>
          <input type="password" id="admin-secret-key" placeholder="Enter admin password..." required />
        </div>
        <button type="submit" class="modal-submit-btn">Unlock Admin Panel</button>
      </form>
    </div>
  </div>

  <!-- ADD CARD MODAL OVERLAY -->
  <div id="add-card-modal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title">Add Manual Article</span>
        <button class="modal-close" onclick="closeAddModal()">X</button>
      </div>
      <form class="modal-form" onsubmit="submitAddCard(event)">
        <div>
          <label for="card-title">Article Title *</label>
          <input type="text" id="card-title" placeholder="e.g. US Unseals Indictment..." required />
        </div>
        <div>
          <label for="card-link">Article Link (URL) *</label>
          <input type="url" id="card-link" placeholder="https://..." required />
        </div>
        <div>
          <label for="card-source">Source Name</label>
          <input type="text" id="card-source" placeholder="DOJ, FATF, MANUAL BRIEF..." />
        </div>
        <div>
          <label for="card-image">Image URL (Optional)</label>
          <input type="url" id="card-image" placeholder="https://..." />
        </div>
        <button type="submit" class="modal-submit-btn">Publish Card</button>
      </form>
    </div>
  </div>

  <script>
    const API_URL = 'https://financial-crime-intelligence-aggregator.onrender.com/api/news';
    const ADMIN_API_URL = 'https://financial-crime-intelligence-aggregator.onrender.com/api/admin/articles';
    const FALLBACK_IMG = 'https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop&w=600&q=80';
    let currentPage = 1;
    let totalPages = 1;

    // Check if ?admin=true is in the URL
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('admin') === 'true') {
      const storedKey = sessionStorage.getItem('admin_key');
      if (storedKey) {
        document.body.classList.add('is-admin');
      } else {
        // Open password prompt modal automatically
        window.addEventListener('DOMContentLoaded', () => {
          openAuthModal();
        });
      }
    }

    // Modal Control Functions
    function openAuthModal() {
      const modal = document.getElementById('auth-card-modal');
      if (modal) modal.classList.add('active');
    }

    function closeAuthModal() {
      const modal = document.getElementById('auth-card-modal');
      if (modal) modal.classList.remove('active');
    }

    function openAddModal() {
      const modal = document.getElementById('add-card-modal');
      if (modal) modal.classList.add('active');
    }

    function closeAddModal() {
      const modal = document.getElementById('add-card-modal');
      if (modal) modal.classList.remove('active');
    }

    // Submit Auth Key Check
    async function submitAdminAuth(event) {
      event.preventDefault();
      const inputKey = document.getElementById('admin-secret-key').value.trim();
      if (!inputKey) return;

      // Validate key against backend via a test request
      try {
        const response = await fetch(`${ADMIN_API_URL}/0`, {
          method: 'DELETE',
          headers: { 'x-admin-key': inputKey }
        });

        if (response.status === 401) {
          alert('Invalid Admin Key');
          return;
        }

        // If not 401, key is valid (even if article 0 wasn't found - 404 means auth passed)
        sessionStorage.setItem('admin_key', inputKey);
        document.body.classList.add('is-admin');
        closeAuthModal();
        fetchNews(currentPage);
      } catch (err) {
        alert('Authentication failed.');
      }
    }

    // Modal Submit Handler
    async function submitAddCard(event) {
      event.preventDefault();

      const key = sessionStorage.getItem('admin_key');
      if (!key) {
        openAuthModal();
        return;
      }

      const title = document.getElementById('card-title').value.trim();
      const link = document.getElementById('card-link').value.trim();
      const source = document.getElementById('card-source').value.trim() || 'MANUAL BRIEF';
      const image_url = document.getElementById('card-image').value.trim();

      try {
        const response = await fetch(ADMIN_API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-admin-key': key
          },
          body: JSON.stringify({ title, link, source, image_url })
        });

        const data = await response.json();

        if (response.ok) {
          alert('Card added successfully!');
          closeAddModal();
          document.getElementById('card-title').value = '';
          document.getElementById('card-link').value = '';
          document.getElementById('card-source').value = '';
          document.getElementById('card-image').value = '';
          fetchNews(1);
        } else {
          alert(`Error: ${data.error}`);
          if (response.status === 401) {
            sessionStorage.removeItem('admin_key');
            document.body.classList.remove('is-admin');
            openAuthModal();
          }
        }
      } catch (err) {
        alert('Failed to add custom card.');
      }
    }

    // Admin Delete Action
    async function handleDeleteCard(articleId) {
      if (!confirm(`Are you sure you want to delete article ID #${articleId}?`)) return;

      const key = sessionStorage.getItem('admin_key');
      if (!key) {
        openAuthModal();
        return;
      }

      try {
        const response = await fetch(`${ADMIN_API_URL}/${articleId}`, {
          method: 'DELETE',
          headers: { 'x-admin-key': key }
        });

        const data = await response.json();

        if (response.ok) {
          alert('Card deleted!');
          fetchNews(currentPage);
        } else {
          alert(`Error: ${data.error}`);
          if (response.status === 401) {
            sessionStorage.removeItem('admin_key');
            document.body.classList.remove('is-admin');
            openAuthModal();
          }
        }
      } catch (err) {
        alert('Failed to delete card.');
      }
    }

    async function fetchNews(page = 1) {
      const container = document.getElementById('news-container');
      if (!container) return;

      container.innerHTML = Array(12).fill(`
        <article class="news-card skeleton-card">
          <div class="card-image-wrapper skeleton-box"></div>
          <div class="card-body">
            <div class="card-meta">
              <div class="skeleton-box" style="width: 70px; height: 18px; border: 2px solid #000;"></div>
              <div class="skeleton-box" style="width: 50px; height: 14px;"></div>
            </div>
            <div class="skeleton-box skeleton-title" style="width: 90%;"></div>
            <div class="skeleton-box skeleton-title" style="width: 60%;"></div>
          </div>
        </article>
      `).join('');

      try {
        const response = await fetch(`${API_URL}?page=${page}&limit=12`);
        if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);

        const data = await response.json();
        const articles = Array.isArray(data) ? data : (data.articles || []);
        
        currentPage = data.currentPage || 1;
        totalPages = data.totalPages || 1;

        if (articles.length === 0) {
          container.innerHTML = '<div class="status-msg">No articles found in the last 14 days.</div>';
          updatePaginationUI();
          return;
        }

        container.innerHTML = '';

        articles.forEach(article => {
          const imgSrc = article.image || FALLBACK_IMG;
          
          const card = `
            <article class="news-card" data-id="${article.id}">
              <div class="card-image-wrapper">
                <img class="card-image" 
                     src="${imgSrc}" 
                     alt="${article.title}" 
                     loading="lazy" 
                     onerror="this.onerror=null; this.src='${FALLBACK_IMG}';">
              </div>
              <div class="card-body">
                <div class="card-meta">
                  <span class="source-tag">${article.source || 'INTELLIGENCE'}</span>
                  <button class="admin-delete-btn" onclick="handleDeleteCard(${article.id})">DELETE</button>
                  <span class="card-date">${article.date || 'Recent'}</span>
                </div>
                <h2 class="card-title">
                  <a href="${article.link}" target="_blank" rel="noopener noreferrer">${article.title}</a>
                </h2>
              </div>
            </article>
          `;
          container.insertAdjacentHTML('beforeend', card);
        });

        updatePaginationUI();

      } catch (error) {
        console.error('Error fetching news:', error);
        container.innerHTML = `<div class="status-msg">Failed to load news: ${error.message}</div>`;
      }
    }

    function updatePaginationUI() {
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');
      const indicator = document.getElementById('page-indicator');

      if (indicator) indicator.innerText = `Page ${currentPage} of ${totalPages}`;
      if (prevBtn) prevBtn.disabled = (currentPage <= 1);
      if (nextBtn) nextBtn.disabled = (currentPage >= totalPages);
    }

    function changePage(direction) {
      const targetPage = currentPage + direction;
      if (targetPage >= 1 && targetPage <= totalPages) {
        fetchNews(targetPage);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    document.addEventListener('DOMContentLoaded', () => fetchNews(1));
  </script>
</body>
