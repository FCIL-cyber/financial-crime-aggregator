<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Crime & Regulatory Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #f4f4f0;
      --header-bg: #f4f4f0;
      --card-bg: #ffffff;
      --text-main: #000000;
      --accent-orange: #ff5500;
      --accent-yellow: #ffe600;
      --border-color: #000000;
      --grid-line: #eaeaea;
      --shadow-hard: 4px 4px 0px #000000;
      --shadow-hard-lg: 6px 6px 0px #000000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background-color: var(--bg-color);
      /* Neo-Brutalist Graph Paper Grid Background */
      background-image: 
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--text-main);
      padding-bottom: 3rem;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Banner / Header */
    header {
      background-color: var(--header-bg);
      border-bottom: 3px solid var(--border-color);
      padding: 1.5rem 2rem;
      margin-bottom: 2.5rem;
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand-box {
      background-color: #ffffff;
      border: 3px solid var(--border-color);
      box-shadow: var(--shadow-hard);
      padding: 0.6rem 1.25rem;
    }

    .brand-box h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }

    .header-tag {
      background-color: var(--accent-orange);
      color: #ffffff;
      border: 3px solid var(--border-color);
      box-shadow: 3px 3px 0px #000;
      padding: 0.5rem 1rem;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Grid Layout - 4 cards per row on desktop */
    .grid-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    /* Brutalist Card Design */
    .news-card {
      background-color: var(--card-bg);
      border: 3px solid var(--border-color);
      box-shadow: var(--shadow-hard-lg);
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .news-card:hover {
      transform: translate(-2px, -2px);
      box-shadow: 8px 8px 0px #000000;
    }

    .card-image-wrapper {
      position: relative;
      width: 100%;
      height: 160px;
      border-bottom: 3px solid var(--border-color);
      overflow: hidden;
      background-color: #e5e7eb;
    }

    .card-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-body {
      padding: 1.1rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .source-tag {
      background-color: var(--accent-yellow);
      color: #000000;
      border: 2px solid var(--border-color);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      padding: 0.2rem 0.45rem;
      text-transform: uppercase;
      box-shadow: 2px 2px 0px #000;
    }

    .card-date {
      color: #000000;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .card-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 0.5rem;
      flex-grow: 1;
    }

    .card-title a {
      color: var(--text-main);
      text-decoration: none;
      transition: background-color 0.1s ease;
    }

    /* Original Hover Effect */
    .card-title a:hover {
      background-color: var(--accent-yellow);
      padding: 0 0.2rem;
    }

    /* Controls & Pagination */
    .pagination-container {
      max-width: 1200px;
      margin: 3.5rem auto 1rem auto;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
    }

    .pagination-btn {
      background-color: var(--accent-orange);
      color: #ffffff;
      border: 3px solid var(--border-color);
      box-shadow: var(--shadow-hard);
      padding: 0.6rem 1.5rem;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.1s ease;
    }

    .pagination-btn:hover:not(:disabled) {
      background-color: #e04b00;
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #000000;
    }

    .pagination-btn:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000000;
    }

    .pagination-btn:disabled {
      opacity: 0.4;
      background-color: #ffffff;
      color: #000000;
      cursor: not-allowed;
      box-shadow: none;
    }

    .page-indicator {
      background-color: #ffffff;
      border: 2px solid var(--border-color);
      padding: 0.5rem 1rem;
      font-weight: 700;
      font-size: 0.85rem;
      box-shadow: 2px 2px 0px #000;
    }

    .status-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 1rem;
      background-color: #ffffff;
      border: 3px solid var(--border-color);
      box-shadow: var(--shadow-hard);
      font-weight: 700;
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      header {
        padding: 1rem;
      }
      .brand-box h1 {
        font-size: 1.15rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <div class="brand-box">
        <h1>Financial Crime Intelligence</h1>
      </div>
      <div class="header-tag">Live Feed</div>
    </div>
  </header>

  <main>
    <div id="news-container" class="grid-container">
      <div class="status-msg">Loading latest intelligence...</div>
    </div>

    <div class="pagination-container">
      <button id="prev-btn" class="pagination-btn" onclick="changePage(-1)" disabled>&larr; Previous</button>
      <span id="page-indicator" class="page-indicator">Page 1</span>
      <button id="next-btn" class="pagination-btn" onclick="changePage(1)" disabled>&rarr; Next</button>
    </div>
  </main>

  <script>
    const API_URL = 'https://financial-crime-intelligence-aggregator.onrender.com/api/news';
    const FALLBACK_IMG = 'https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop&w=600&q=80';
    let currentPage = 1;
    let totalPages = 1;

    async function fetchNews(page = 1) {
      const container = document.getElementById('news-container');
      if (!container) return;

      container.innerHTML = '<div class="status-msg">Loading intelligence feed...</div>';

      try {
        const response = await fetch(`${API_URL}?page=${page}&limit=12`);
        if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);

        const data = await response.json();
        const articles = Array.isArray(data) ? data : (data.articles || []);
        
        currentPage = data.currentPage || 1;
        totalPages = data.totalPages || 1;

        if (articles.length === 0) {
          container.innerHTML = '<div class="status-msg">No articles found in the last 14 days.</div>';
          updatePaginationUI();
          return;
        }

        container.innerHTML = '';

        articles.forEach(article => {
          const imgSrc = article.image || FALLBACK_IMG;
          
          const card = `
            <article class="news-card">
              <div class="card-image-wrapper">
                <img class="card-image" 
                     src="${imgSrc}" 
                     alt="${article.title}" 
                     loading="lazy" 
                     onerror="this.onerror=null; this.src='${FALLBACK_IMG}';">
              </div>
              <div class="card-body">
                <div class="card-meta">
                  <span class="source-tag">${article.source || 'INTELLIGENCE'}</span>
                  <span class="card-date">${article.date || 'Recent'}</span>
                </div>
                <h2 class="card-title">
                  <a href="${article.link}" target="_blank" rel="noopener noreferrer">${article.title}</a>
                </h2>
              </div>
            </article>
          `;
          container.insertAdjacentHTML('beforeend', card);
        });

        updatePaginationUI();

      } catch (error) {
        console.error('Error fetching news:', error);
        container.innerHTML = `<div class="status-msg">Failed to load news: ${error.message}</div>`;
      }
    }

    function updatePaginationUI() {
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');
      const indicator = document.getElementById('page-indicator');

      if (indicator) indicator.innerText = `Page ${currentPage} of ${totalPages}`;
      if (prevBtn) prevBtn.disabled = (currentPage <= 1);
      if (nextBtn) nextBtn.disabled = (currentPage >= totalPages);
    }

    function changePage(direction) {
      const targetPage = currentPage + direction;
      if (targetPage >= 1 && targetPage <= totalPages) {
        fetchNews(targetPage);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    document.addEventListener('DOMContentLoaded', () => fetchNews(1));
  </script>
</body>
</html>
