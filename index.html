<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Crime & Regulatory Intelligence</title>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-main: #111827;
      --text-muted: #6b7280;
      --accent: #d97706;
      --border: #e5e7eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 40px 20px;
    }

    .header {
      max-width: 1200px;
      margin: 0 auto 40px;
      border-bottom: 2px solid var(--text-main);
      padding-bottom: 20px;
    }

    .header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .header p {
      color: var(--text-muted);
      margin-top: 6px;
      font-size: 1rem;
    }

    .news-grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-decoration: none;
      color: inherit;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 20px -8px rgba(0, 0, 0, 0.1);
    }

    .card-img-wrapper {
      width: 100%;
      height: 200px;
      overflow: hidden;
      background-color: #e2e8f0;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-content {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .source-tag {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 16px;
      color: var(--text-main);
    }

    .card-date {
      margin-top: auto;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .loading {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 0;
      color: var(--text-muted);
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <header class="header">
    <h1>Financial Crime & Regulatory Intelligence</h1>
    <p>Real-time enforcement actions, compliance alerts, and policy updates</p>
  </header>

  <main id="news-grid" class="news-grid">
    <div class="loading">Loading news feed...</div>
  </main>

  <script>
    const API_URL = 'https://financial-crime-intelligence-aggregator.onrender.com/api/news';

    async function fetchNews() {
      const container = document.getElementById('news-grid');
      try {
        const res = await fetch(API_URL);
        const articles = await res.json();

        if (!articles.length) {
          container.innerHTML = '<div class="loading">No articles found.</div>';
          return;
        }

        container.innerHTML = articles.map(item => `
          <a href="${item.link}" target="_blank" class="card">
            <div class="card-img-wrapper">
              <img src="${item.image}" alt="Article thumbnail" class="card-img" onerror="this.src='https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop&w=600&q=80'">
            </div>
            <div class="card-content">
              <span class="source-tag">${item.source}</span>
              <h2 class="card-title">${item.title}</h2>
              <span class="card-date">${item.date}</span>
            </div>
          </a>
        `).join('');
      } catch (err) {
        container.innerHTML = '<div class="loading">Failed to load news. Ensure server is running.</div>';
      }
    }

    fetchNews();
  </script>
</body>
</html>
